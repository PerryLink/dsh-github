# Nearest-workspace root for this standalone plugin package. This file makes
# pnpm treat dsh-github as an independent workspace when the repository is
# checked out next to (or inside) other pnpm workspaces, such as a
# deepseek-harness checkout.
packages:
  - .

# esbuild (devDependency of vitest) ships a postinstall build script; pnpm 11
# exits non-zero on unapproved builds, so the dev build is allowlisted here —
# the runtime plugin itself needs no native builds.
allowBuilds:
  esbuild: true
